name: Semantic Release
on:
  push:
    branches:
      - main
      - PROD-14446
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Generate Semantic Release Config
        run: |
          cat << 'EOF' > .releaserc.json
          {
            "branches": ["main","PROD-14446"],
            "repositoryUrl": "https://github.com/projectxyzio/appium-inspector.git",
            "plugins": [
              ["@semantic-release/commit-analyzer", {
                "preset": "conventionalcommits",
                 "releaseRules": [
                  {"breaking": true, "release": "major"},
                  {"type": "breaking", "release": "major"},
                  {"type": "BREAKING", "release": "major"},
                  {"type": "Breaking", "release": "major"},
                  {"release": "minor"}
                ]
              }],
              ["@semantic-release/release-notes-generator", { "preset": "conventionalcommits" }],
              ["@semantic-release/github", {
                "successComment": false,
                "failComment": false,
                "failTitle": false
              }]
            ]
          }
          EOF

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install conventional-changelog-conventionalcommits
          npx semantic-release

  trigger-orchestrator:
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: semantic-release
      cancel-in-progress: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout DevTools (For Script Location)
        uses: actions/checkout@v4
        with:
          repository: projectxyzio/devtools
          ref: master
          path: headspin/devtools
          fetch-depth: 0
          token: ${{ secrets.SEMANTIC_RELEASE_PAT }}

      - name: Clone Versions Repository
        uses: actions/checkout@v4
        with:
          repository: projectxyzio/versions
          path: headspin/versions
          fetch-depth: 0
          token: ${{ secrets.SEMANTIC_RELEASE_PAT }}
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set HEADSPIN_HOME
        run: |
          echo "HEADSPIN_HOME=$GITHUB_WORKSPACE/headspin" >> $GITHUB_ENV

      - name: Install Base Python Utilities
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pathlib unicodecsv

      - name: Install Python Requirements
        run: |
          pip install -r headspin/devtools/py3-requirements.txt
          
      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Run Semantic Release (hsrelease)
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/headspin/devtools:$GITHUB_WORKSPACE/headspin:$PYTHONPATH"
          python headspin/devtools/tools/hsrelease.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
